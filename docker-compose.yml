version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: postgres_test
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=test_db
    ports:
      - "5432:5432"
    volumes:
      # Use the root postgres directory for version 18 compatibility
      - postgres_data:/var/lib/postgresql
    restart: always

volumes:
  postgres_data:

